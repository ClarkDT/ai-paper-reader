<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿唐的 AI 论文阅读站</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a2332; --ink2:#5b6b7f; --line:#e4e8ee;
    --accent:#2f6fed; --accent-soft:#eaf1fe; --ok:#1a9e6c; --ok-soft:#e6f6ef;
    --gold:#b8860b; --gold-soft:#faf3e0; --warn:#d9534f;
    --c-classic:#8a6d3b; --c-agent:#7c4dbe; --c-fin:#1a7f8c; --c-chip:#c2552a;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 28px;
         display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:10}
  header h1{font-size:19px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  header h1 span{color:var(--accent)}
  #weekSel{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:420px}
  #progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);white-space:nowrap}
  .pbar{width:130px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
  #gearBtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--ink2)}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:0;max-width:1280px;margin:0 auto;min-height:calc(100vh - 63px)}
  aside{border-right:1px solid var(--line);background:var(--panel);padding:18px 14px;overflow-y:auto;max-height:calc(100vh - 63px);position:sticky;top:63px}
  #search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:12px;background:var(--bg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--ink2);background:var(--panel)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .plist{display:flex;flex-direction:column;gap:6px}
  .pitem{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .pitem:hover{background:var(--bg)}
  .pitem.on{background:var(--accent-soft);border-color:#cdddfd}
  .pitem .t{font-size:13.5px;font-weight:600;line-height:1.5}
  .pitem .m{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--ink2)}
  .tag{padding:1px 8px;border-radius:99px;font-size:11px;color:#fff}
  .pitem.read .t::after{content:" ✓";color:var(--ok);font-weight:700}
  #emptyList{color:var(--ink2);font-size:13px;text-align:center;padding:30px 0}

  main{padding:30px 40px 80px;min-width:0}
  .weekhead{margin-bottom:22px}
  .weekhead h2{font-size:21px;margin-bottom:4px}
  .weekhead .sub{color:var(--ink2);font-size:13px}
  .weekhead .order{margin-top:10px;background:var(--gold-soft);border:1px solid #efe2c0;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#6b5313}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px}
  .ptitle{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:6px}
  .meta{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
  .meta .diff{color:var(--gold);letter-spacing:1px}
  .tldr{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14.5px;margin-bottom:12px}
  .why{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;color:#5c4a12}
  .tldr b,.why b{display:block;font-size:12px;margin-bottom:2px}
  .tldr b{color:var(--accent)} .why b{color:var(--gold)}

  .sec{margin-bottom:18px}
  .sec h4{font-size:13px;color:var(--accent);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
  .sec p{font-size:14.5px}
  .terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .term{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
  .term b{color:var(--ink)} .term .zh{color:var(--accent);font-size:12px;margin-left:6px}
  .term .ex{color:var(--ink2);margin-top:2px}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .plan{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
  .plan b{display:block;font-size:12px;color:var(--ok);margin-bottom:4px}
  .abs{font-size:13px;color:var(--ink2)}
  .abs summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:600}

  .actions{display:flex;gap:10px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13.5px;padding:8px 18px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn:hover{opacity:.9}

  textarea#mynote{width:100%;min-height:90px;font:inherit;font-size:13.5px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
  .savedhint{font-size:11.5px;color:var(--ok);margin-top:4px;height:14px}

  .askbox{margin-top:4px}
  .askrow{display:flex;gap:10px}
  .askrow input{flex:1;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  #askOut{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;white-space:pre-wrap;display:none}
  #askErr{margin-top:8px;color:var(--warn);font-size:12.5px;display:none}
  .noai{font-size:12.5px;color:var(--ink2)}

  dialog{border:none;border-radius:14px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.18);width:460px}
  dialog::backdrop{background:rgba(20,30,50,.35)}
  dialog h3{margin-bottom:14px;font-size:17px}
  dialog label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 4px}
  dialog input{width:100%;font:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
  dialog .hint{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.6}
  dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

  .placeholder{max-width:560px;margin:80px auto;text-align:center;color:var(--ink2)}
  .placeholder h2{color:var(--ink);margin-bottom:10px;font-size:20px}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    aside{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
    main{padding:20px 16px 60px}
    .plans{grid-template-columns:1fr}
  }
  @media print{
    header,aside,.actions,.askbox,#gearBtn{display:none!important}
    .layout{grid-template-columns:1fr} main{padding:0}
    .card{border:none;page-break-inside:avoid}
  }
</style>
</head>
<body>

<header>
  <h1>📊 阿唐的 <span>AI 论文阅读站</span></h1>
  <select id="weekSel" title="选择周次"></select>
  <div id="progress"><span id="progText"></span><div class="pbar"><i id="progBar"></i></div></div>
  <button id="gearBtn" title="AI 设置">⚙️</button>
</header>

<div class="layout">
  <aside>
    <input id="search" type="search" placeholder="搜索标题 / 关键词…">
    <div class="chips" id="chips"></div>
    <div class="plist" id="plist"></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <h3>AI 提问设置（可选）</h3>
  <label>API 地址（OpenAI 兼容，以 /v1 结尾）</label>
  <input id="sBase" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
  <label>API Key（只存在本机浏览器 localStorage）</label>
  <input id="sKey" type="password" placeholder="sk-…">
  <label>模型名</label>
  <input id="sModel" placeholder="qwen-plus / gpt-4o-mini / deepseek-chat">
  <div class="hint">不填也能正常阅读和记笔记。填好后每篇论文下方出现「问这篇论文」，AI 会带着论文的笔记和摘要回答你的问题。密钥仅保存在你本机，不会上传到任何服务器（GitHub Pages 上也只是你自己的浏览器本地存储）。</div>
  <div class="row">
    <button class="btn" id="sCancel">取消</button>
    <button class="btn primary" id="sSave">保存</button>
  </div>
</dialog>

<script>
/* ============ 数据加载：动态注入 week-*.js，双击本地打开也可用 ============ */
let MANIFEST = null, DATA = {}, curWeek = null, curPaper = null;
let filter = { q: '', cat: '全部' };
const $ = s => document.querySelector(s);
const store = {
  get: k => localStorage.getItem('prs_' + k),
  set: (k, v) => localStorage.setItem('prs_' + k, v)
};

function loadScript(src) {
  return new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = bad;
    document.head.appendChild(s);
  });
}

async function boot() {
  try {
    await loadScript('data/manifest.js');
    MANIFEST = window.WEEK_MANIFEST;
    for (const w of MANIFEST.weeks) await loadScript('data/week-' + w.week + '.js');
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="placeholder"><h2>数据加载失败</h2>请确认 index.html 与 data/ 文件夹在同一目录下。</div>';
    return;
  }
  DATA = window.WEEKS_DATA || {};
  const sel = $('#weekSel');
  MANIFEST.weeks.forEach(w => {
    const o = document.createElement('option');
    o.value = w.week;
    o.textContent = `${w.week} · ${w.title}（${w.count} 篇）`;
    sel.appendChild(o);
  });
  sel.onchange = () => { curWeek = sel.value; curPaper = null; renderList(); renderMain(); };
  curWeek = MANIFEST.weeks[0] && MANIFEST.weeks[0].week;
  renderList(); renderMain();
}

/* ============ 渲染 ============ */
const CATS = ['全部', '经典必读', 'Agent 前沿', 'AI+金融', 'AI 芯片算力'];
const CAT_COLOR = { '经典必读': 'var(--c-classic)', 'Agent 前沿': 'var(--c-agent)', 'AI+金融': 'var(--c-fin)', 'AI 芯片算力': 'var(--c-chip)' };

function weekPapers() { return (DATA[curWeek] && DATA[curWeek].papers) || []; }

function renderList() {
  const chips = $('#chips');
  chips.innerHTML = '';
  CATS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'chip' + (filter.cat === c ? ' on' : '');
    el.textContent = c;
    el.onclick = () => { filter.cat = c; renderList(); };
    chips.appendChild(el);
  });

  const q = filter.q.trim().toLowerCase();
  const ps = weekPapers().filter(p =>
    (filter.cat === '全部' || p.category === filter.cat) &&
    (!q || (p.title + p.tldr + p.arxiv).toLowerCase().includes(q))
  );
  const list = $('#plist');
  list.innerHTML = '';
  if (!ps.length) { list.innerHTML = '<div id="emptyList">没有匹配的论文</div>'; return; }
  ps.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pitem' + (curPaper === p.arxiv ? ' on' : '') + (store.get('read_' + p.arxiv) ? ' read' : '');
    el.innerHTML = `<div class="t">${p.no}. ${esc(p.title)}</div>
      <div class="m"><span class="tag" style="background:${CAT_COLOR[p.category]}">${p.category}</span>
      <span>${p.arxiv}</span><span class="diff">${p.difficulty}</span></div>`;
    el.onclick = () => { curPaper = p.arxiv; renderList(); renderMain(); window.scrollTo(0, 0); };
    list.appendChild(el);
  });
  updateProgress();
}

function updateProgress() {
  const ps = weekPapers();
  const n = ps.filter(p => store.get('read_' + p.arxiv)).length;
  $('#progText').textContent = `本周 ${n}/${ps.length}`;
  $('#progBar').style.width = ps.length ? (100 * n / ps.length) + '%' : '0';
}

function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderMain() {
  const main = $('#main');
  const wd = DATA[curWeek];
  if (!wd) { main.innerHTML = ''; return; }

  let html = `<div class="weekhead">
    <h2>${esc(wd.week)} · ${esc(wd.theme)}</h2>
    <div class="sub">${esc(wd.generatedAt)} 生成 · ${wd.source}</div>
    ${wd.readOrder ? `<div class="order">📖 <b>建议读法：</b>${esc(wd.readOrder)}</div>` : ''}
  </div>`;

  const p = weekPapers().find(x => x.arxiv === curPaper);
  if (!p) {
    html += `<div class="placeholder"><h2>← 从左侧选一篇开始</h2>
      每篇都有「三分钟看懂」的中文精读笔记，读起来毫无压力。<br>
      点击标题下方链接可跳转 arXiv 原文或 PDF。</div>`;
    main.innerHTML = html;
    return;
  }

  const read = store.get('read_' + p.arxiv);
  html += `
  <div class="card">
    <div class="ptitle">${p.no}. ${esc(p.title)}</div>
    <div class="meta">
      <span class="tag" style="background:${CAT_COLOR[p.category]}">${p.category}</span>
      <span>arXiv: ${p.arxiv}</span><span>${p.published}</span>
      <span class="diff">难度 ${p.difficulty}</span>
      <span><a href="${p.link}" target="_blank">原文 ↗</a></span>
      <span><a href="${p.pdf}" target="_blank">PDF ↗</a></span>
    </div>
    <div class="tldr"><b>三分钟看懂</b>${esc(p.tldr)}</div>
    <div class="why"><b>为什么值得你读</b>${esc(p.why_read)}</div>
  </div>

  <div class="card">
    <div class="sec"><h4>它要解决什么问题</h4><p>${esc(p.note_problem)}</p></div>
    <div class="sec"><h4>怎么解决的</h4><p>${esc(p.note_method)}</p></div>
    <div class="sec"><h4>结果如何</h4><p>${esc(p.note_results)}</p></div>
    <div class="sec"><h4>为什么重要</h4><p>${esc(p.note_importance)}</p></div>
    <div class="sec"><h4>与阿唐何干</h4><p>${esc(p.note_for_me)}</p></div>
  </div>

  <div class="card">
    <div class="sec"><h4>关键术语</h4><div class="terms">
      ${p.terms.map(t => `<div class="term"><b>${esc(t.en)}</b><span class="zh">${esc(t.zh)}</span><div class="ex">${esc(t.explain)}</div></div>`).join('')}
    </div></div>
    <div class="sec"><h4>阅读路径</h4><div class="plans">
      <div class="plan"><b>⏱ 30 分钟版（只抓核心）</b>${esc(p.plan_30)}</div>
      <div class="plan"><b>📖 2 小时版（精读）</b>${esc(p.plan_2h)}</div>
    </div></div>
    <details class="abs"><summary>展开英文原始摘要（arXiv 官方）</summary><p style="margin-top:8px">${esc(p.abstract)}</p></details>
  </div>

  <div class="card">
    <div class="actions">
      <button class="btn ${read ? 'done' : 'primary'}" id="readBtn">${read ? '✓ 已读完（点击取消）' : '标记为已读'}</button>
      <button class="btn" onclick="window.print()">🖨 打印 / 存 PDF</button>
    </div>
    <div class="sec"><h4>我的笔记（自动保存在本机）</h4>
      <textarea id="mynote" placeholder="读完写两句话：这篇对我最大的启发是…">${esc(store.get('note_' + p.arxiv) || '')}</textarea>
      <div class="savedhint" id="saveHint"></div>
    </div>
    <div class="askbox">
      <div class="sec"><h4>问这篇论文</h4>
        <div id="askArea">${settings.apiBase && settings.apiKey
          ? `<div class="askrow"><input id="askIn" placeholder="例如：这篇和 FinGPT 的路线有什么区别？"><button class="btn primary" id="askBtn">提问</button></div>
             <div id="askErr"></div><div id="askOut"></div>`
          : `<div class="noai">⚙️ 在右上角设置里填入 AI 接口后，可以在这里对论文内容提问。</div>`}
        </div>
      </div>
    </div>
  </div>`;

  main.innerHTML = html;

  $('#readBtn').onclick = () => {
    if (store.get('read_' + p.arxiv)) store.removeItem('read_' + p.arxiv);
    else store.set('read_' + p.arxiv, '1');
    renderList(); renderMain();
  };
  const ta = $('#mynote');
  if (ta) ta.oninput = () => {
    store.set('note_' + p.arxiv, ta.value);
    $('#saveHint').textContent = '✓ 已保存到本机 ' + new Date().toLocaleTimeString('zh-CN');
  };
  const ab = $('#askBtn');
  if (ab) {
    ab.onclick = doAsk;
    $('#askIn').addEventListener('keydown', e => { if (e.key === 'Enter') doAsk(); });
  }
}

/* ============ AI 提问（OpenAI 兼容接口，直连，密钥不出本机） ============ */
let settings = JSON.parse(store.get('settings') || '{"apiBase":"","apiKey":"","model":""}');

async function doAsk() {
  const inp = $('#askIn'), out = $('#askOut'), err = $('#askErr');
  const q = inp.value.trim();
  if (!q) return;
  const p = weekPapers().find(x => x.arxiv === curPaper);
  out.style.display = 'block';
  out.textContent = '思考中…';
  err.style.display = 'none';
  try {
    const base = settings.apiBase.replace(/\/+$/, '');
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.apiKey },
      body: JSON.stringify({
        model: settings.model || 'qwen-plus',
        messages: [{
          role: 'user',
          content: `你是论文精读助手。以下是论文《${p.title}》(arXiv:${p.arxiv}) 的背景资料：\n` +
            `【一句话概括】${p.tldr}\n【要解决的问题】${p.note_problem}\n【方法】${p.note_method}\n【结果】${p.note_results}\n` +
            `【官方摘要】${p.abstract}\n\n读者的问题：${q}\n\n用简体中文回答，直接了当，必要时可以指出问题本身的前提偏差。`
        }],
        temperature: 0.4
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' — 检查 API 地址 / Key / 模型名');
    const j = await resp.json();
    out.textContent = j.choices && j.choices[0] ? j.choices[0].message.content : JSON.stringify(j);
  } catch (e) {
    out.style.display = 'none';
    err.style.display = 'block';
    err.textContent = '❌ 调用失败：' + e.message + '（跨域被拦截时，说明该服务商不允许浏览器直连，可换兼容接口）';
  }
}

/* ============ 设置 ============ */
const dlg = $('#dlg');
$('#gearBtn').onclick = () => {
  $('#sBase').value = settings.apiBase; $('#sKey').value = settings.apiKey; $('#sModel').value = settings.model;
  dlg.showModal();
};
$('#sCancel').onclick = () => dlg.close();
$('#sSave').onclick = () => {
  settings = { apiBase: $('#sBase').value.trim(), apiKey: $('#sKey').value.trim(), model: $('#sModel').value.trim() };
  store.set('settings', JSON.stringify(settings));
  dlg.close(); renderMain();
};

/* ============ 搜索 ============ */
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filter.q = e.target.value; renderList(); }, 200);
});

boot();
</script>
</body>
</html>
